<body>
  <section class="section sv-card">
    <div class="sv-card-head sv-card-head-row">
      <div>
        <h2 class="section-title sv-section-heading" data-i18n="instances.title">Instances</h2>
        <div id="sessionsSubtitle" class="sv-subtitle" data-i18n="instances.subtitle">Detected from Docker daemon</div>
      </div>
      <div class="dm-instances-actions">
        <button id="createLocalInstanceBtn" class="button confirm" type="button" disabled title="Install a version before creating a local Instance" data-i18n-title="instances.createLocalTitle">
          <span class="material-symbols-outlined" aria-hidden="true">add</span>
          <span data-i18n="instances.createLocal">Create local Instance</span>
        </button>
        <button id="addRemoteInstanceBtn" class="button" type="button">
          <span class="material-symbols-outlined" aria-hidden="true">add_link</span>
          <span data-i18n="instances.addRemote">Add remote Instance</span>
        </button>
      </div>
    </div>
    <div id="localList" class="dm-cards-grid"></div>
  </section>
  <script type="module" src="components/docker-manager/local-testing/local-testing.js"></script>
</body>
